<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>IFRAME 智能同步面板</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,sans-serif}
    body{margin:0;padding:12px;background:#f7f8fa}
    .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
    .section{margin-bottom:12px}
    label{font-weight:500;font-size:14px;margin-bottom:4px;display:block}
    input,button{border-radius:6px;border:1px solid #ddd;padding:8px 10px;font-size:14px}
    .btn-row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
    button{cursor:pointer;border:none;color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    .btn-sync{background:#0071e3}
    .btn-auto{background:#28a745}
    .btn-stop{background:#6c757d}
    .btn-refresh{background:#17a2b8}
    .btn-ws{background:#9c27b0}
    .version-row{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin:8px 0}
    .tag{background:#e9ecef;padding:4px 8px;border-radius:6px}
    .log-box{height:160px;background:#f8f9fa;border:1px solid #ddd;border-radius:8px;padding:8px;
      font-size:12px;white-space:pre-wrap;overflow-y:auto;margin-top:6px}
    .status{padding:8px 10px;border-radius:6px;margin:8px 0;font-size:14px}
    .status-success{background:#e8f5e9;color:#1b5e20}
    .status-error{background:#ffebee;color:#b71c1c}
    .status-info{background:#e3f2fd;color:#0d47a1}
    .status-warn{background:#fff8e1;color:#8d6e00}
    .ws-row{display:flex;gap:8px;margin:8px 0}
    #wsChat{flex:1}
    .config-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
    .config-row label{margin:0;font-size:12px}
    .config-row input{width:60px;font-size:12px}
    /* 人工处置对话框 */
    .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
      align-items:center;justify-content:center;z-index:9999;padding:16px}
    .modal-card{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:100%;
      box-shadow:0 8px 30px rgba(0,0,0,.25)}
    .modal-card h3{margin:0 0 10px;font-size:16px;color:#b71c1c}
    .cf-msg{font-size:13px;color:#333;background:#f8f9fa;border-radius:8px;padding:10px;
      white-space:pre-wrap;line-height:1.6;margin-bottom:14px;max-height:220px;overflow:auto}
    .cf-btns{display:flex;flex-direction:column;gap:8px}
    .cf-btns button{padding:11px;border-radius:8px;font-size:14px;text-align:left}
    .cf-a{background:#0071e3}
    .cf-b{background:#d84315}
    .cf-c{background:#6c757d}
  </style>
</head>
<body>

<div class="card">
  <div class="section">
    <label id="syncStatusLabel">同步状态（主动同步: 关闭）</label>
    <div id="statusText" class="status status-info">等待操作</div>
  </div>

  <div class="section">
    <label>WebSocket 状态</label>
    <div id="wsStatus" class="status status-info">未连接</div>
  </div>

  <div class="version-row">
    <div class="tag">脚本版本: <span id="v_script">1.00</span></div>
    <div class="tag">本地版本: <span id="v_local">0</span></div>
    <div class="tag">所知云端: <span id="v_cloud">0</span></div>
    <div class="tag">LSID: <span id="v_lsid">0</span></div>
    <div class="tag">用户ID: <span id="v_yonghu">未设置</span></div>
  </div>

  <div class="section">
    <label>👤 用户ID设置</label>
    <div class="config-row">
      <input type="text" id="yonghuID" placeholder="输入用户ID" style="flex:1;">
      <button class="btn-sync" onclick="saveYonghuID()">确认写入</button>
    </div>
  </div>

  <div class="section">
    <label>⚙️ WebSocket 配置</label>
    <div class="config-row">
      <label>心跳间隔(秒):</label>
      <input type="number" id="heartbeatSec" value="60" min="10">
      <label>广播次数:</label>
      <input type="number" id="broadcastCount" value="3" min="1">
      <label>广播间隔(秒):</label>
      <input type="number" id="broadcastSec" value="10" min="1">
    </div>
  </div>

  <div class="section">
    <label>⚙️ 主动同步配置</label>
    <div class="config-row">
      <label>无差异间隔(秒):</label>
      <input type="number" id="syncNoDiff" value="300" min="10">
      <label>有差异间隔(秒):</label>
      <input type="number" id="syncDiff" value="30" min="5">
      <label>差异阈值:</label>
      <input type="number" id="diffLimit" value="10" min="1">
      <label>最长运行时间(小时):</label>
      <input type="number" id="maxRunTime" value="4" min="1" max="24">
    </div>
  </div>

  <div class="btn-row">
    <button id="btnSync" class="btn-sync" onclick="doSync('', false)">🔄 立即同步</button>
    <button id="autoSyncBtn" class="btn-auto" onclick="toggleAutoSync()">▶️ 自动同步（关闭）</button>
    <button class="btn-refresh" onclick="refreshVersion()">🔁 刷新显示</button>
  </div>

  <div class="ws-row">
    <input type="text" id="wsChat" placeholder="输入测试文本，发送到WebSocket...">
    <button class="btn-ws" onclick="sendWsChat()">📩 发送测试</button>
  </div>

  <div class="section">
    <label>📤 发送数据日志</label>
    <div id="logSend" class="log-box">等待发送...</div>
  </div>
  <div class="section">
    <label>📥 返回数据日志</label>
    <div id="logResp" class="log-box">等待返回...</div>
  </div>

  <div class="section">
    <label>🔌 WebSocket 日志</label>
    <div id="wsLog" class="log-box">等待WebSocket消息...</div>
  </div>
</div>

<div id="conflictModal" class="modal-mask" style="display:none">
  <div class="modal-card">
    <h3 id="cfTitle">需要你决定怎么处理</h3>
    <div id="cfMsg" class="cf-msg"></div>
    <div id="cfBtns" class="cf-btns"></div>
  </div>
</div>

<script>
/* ==========================================================================
 * 快速记事 · 同步面板
 * 版本：1.00   （与云端脚本同版本号，改动一并 +0.01）
 * 配套云端脚本：快速记事.js v1.00
 * ========================================================================== */

const JIAOBEN_BANBEN = "1.00";
const API_URL = "https://1408347752-dxgsap4qrj.ap-guangzhou.tencentscf.com";
const WEBHOOK_URL = "https://www.kdocs.cn/api/v3/ide/file/cgB1g30d49xW/script/V2-350tGnoIv3cFg8GvJrrg7x/sync_task";

// WebSocket：频道名由用户ID哈希派生，避免把手机号暴露在公共频道上
const WS_BASE = "wss://free.blr2.piesocket.com/v3/";
const WS_KEY  = "ReDFavhh0qnOCKUUjQiLKVZ9RdxA6e4BGVKxxNug";

// 本地存储 KEY（与 index.html / hengban.html 必须完全一致）
const STORAGE_KEYS = {
  bendibanben: "bendibanben",
  bediyunbanben: "bediyunbanben",
  lsid: "sync_lsid_10digit",
  yonghuID: "yonghuID",
  records: "jichibang_records",
  people: "cfg_people",
  leader: "cfg_leader",
  status4: "cfg_status4"
};

// 跨标签页同步互斥锁
const CROSSTAB_LOCK = "ksjsb_sync_lock";
const CROSSTAB_LOCK_TTL = 25000;
const TAB_TOKEN = "t" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);

let autoTimer = null;
let ws = null;
let wsReconnectTimer = null;
let heartbeatTimer = null;
let broadcastTimers = [];
const reconnectDelay = 3000;

let retryCount = 0;
const maxRetry = 3;
let retryTimer = null;

// 并发/冲突控制
let syncInFlight = false;      // 同一页面内同一时刻只允许一次同步
let conflictPaused = false;    // 出现需人工处置的冲突后，暂停自动同步

/* ======================= 版本号与本地存储 ======================= */

function toInt(v) { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; }

function getLocalVer()      { return toInt(localStorage.getItem(STORAGE_KEYS.bendibanben)); }
function getBediyunbanben() { return toInt(localStorage.getItem(STORAGE_KEYS.bediyunbanben)); }
function getYonghuID()      { return localStorage.getItem(STORAGE_KEYS.yonghuID) || ""; }
function isUserLoggedIn()   { return !!getYonghuID(); }

function getLSID() {
  let idStr = localStorage.getItem(STORAGE_KEYS.lsid);
  if (!idStr) {
    idStr = String(Math.floor(1000000000 + Math.random() * 9000000000));
    localStorage.setItem(STORAGE_KEYS.lsid, idStr);
  }
  return Number(idStr);
}

function getLocalData() {
  return {
    records: JSON.parse(localStorage.getItem(STORAGE_KEYS.records) || "[]"),
    people: localStorage.getItem(STORAGE_KEYS.people) || "",
    leader: localStorage.getItem(STORAGE_KEYS.leader) || "",
    status4: localStorage.getItem(STORAGE_KEYS.status4) || "",
    yonghuID: getYonghuID() || ""
  };
}

/* 只校准版本号，不动数据内容 */
function setVersions(yunbanben) {
  const v = toInt(yunbanben);
  localStorage.setItem(STORAGE_KEYS.bediyunbanben, String(v));
  localStorage.setItem(STORAGE_KEYS.bendibanben, String(v));
  refreshVersion();
}

/* 用云端数据整体覆盖本地（含版本号）。返回是否成功 */
function applyCloudData(yunbanben, yunxinxi) {
  if (!yunxinxi) {
    appendWsLog("⚠️ 云端内容为空，已拒绝覆盖本地，避免误清数据");
    return false;
  }
  let data;
  try {
    data = JSON.parse(yunxinxi);
  } catch (e) {
    appendWsLog("❌ 云端内容不是合法 JSON，已拒绝覆盖本地：" + e.message);
    return false;
  }
  try {
    localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(data.records || []));
    localStorage.setItem(STORAGE_KEYS.people, data.people || "");
    localStorage.setItem(STORAGE_KEYS.leader, data.leader || "");
    // 修复：字段名是 status4，原代码写成 status，导致每次覆盖都清空"状态选项"
    localStorage.setItem(STORAGE_KEYS.status4, data.status4 || "");
    setVersions(yunbanben);
    return true;
  } catch (e) {
    appendWsLog("❌ 写入本地失败：" + e.message);
    return false;
  }
}

function refreshVersion() {
  document.getElementById("v_script").innerText = JIAOBEN_BANBEN;
  document.getElementById("v_local").innerText = getLocalVer();
  document.getElementById("v_cloud").innerText = getBediyunbanben();
  document.getElementById("v_lsid").innerText = getLSID();
  document.getElementById("v_yonghu").innerText = getYonghuID() || "未设置";
}

/* ======================= 状态与日志 ======================= */

function updateSyncStatusLabel() {
  const label = document.getElementById("syncStatusLabel");
  label.textContent = "同步状态（自动同步: " + (autoTimer ? "已开启" : "已关闭") + "）";
  const btn = document.getElementById("autoSyncBtn");
  if (btn) {
    if (autoTimer) { btn.textContent = "⏹️ 自动同步（开启）"; btn.className = "btn-stop"; }
    else { btn.textContent = "▶️ 自动同步（关闭）"; btn.className = "btn-auto"; }
  }
}

function setStatus(text, kind) {
  const el = document.getElementById("statusText");
  el.innerText = text;
  el.className = "status " + (kind === "error" ? "status-error" : kind === "warn" ? "status-warn" : kind === "info" ? "status-info" : "status-success");
  updateSyncStatusLabel();
}
function setWsStatus(text, isError) {
  const el = document.getElementById("wsStatus");
  el.innerText = text;
  el.className = "status " + (isError ? "status-error" : "status-success");
}
function appendWsLog(msg) {
  const log = document.getElementById("wsLog");
  log.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg + "\n" + log.innerText;
}

function checkLoginStatus() {
  if (!isUserLoggedIn()) {
    setStatus("请先登录", "error");
    setWsStatus("未登录，WebSocket未连接", true);
    return false;
  }
  return true;
}

function notifyParentToRefresh() {
  try { if (window.parent !== window) window.parent.postMessage("refreshFromCloud", "*"); } catch (e) { }
}

/* ======================= 乱码相关 ======================= */

function hasBrokenChar(str) { return str && String(str).indexOf('\uFFFD') >= 0; }

function findBrokenData() {
  const data = getLocalData();
  const brokenKeys = [];
  for (const key in data) {
    if (hasBrokenChar(JSON.stringify(data[key]))) brokenKeys.push(key);
  }
  return brokenKeys;
}

function stopBrokenRetry() {
  if (retryTimer) clearTimeout(retryTimer);
  retryCount = 0;
}

/* ======================= 跨标签页互斥 ======================= */

function acquireCrossTabLock() {
  try {
    const raw = localStorage.getItem(CROSSTAB_LOCK);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.token && o.token !== TAB_TOKEN && (Date.now() - o.ts) < CROSSTAB_LOCK_TTL) return false;
    }
    localStorage.setItem(CROSSTAB_LOCK, JSON.stringify({ token: TAB_TOKEN, ts: Date.now() }));
    return true;
  } catch (e) { return true; }
}
function releaseCrossTabLock() {
  try {
    const raw = localStorage.getItem(CROSSTAB_LOCK);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.token === TAB_TOKEN) localStorage.removeItem(CROSSTAB_LOCK);
    }
  } catch (e) { }
}

/* ======================= 核心同步 ======================= */

const MSG = {
  101: "传入字段格式错误",
  102: "用户ID不存在",
  107: "编码异常（本地数据含乱码）",
  201: "本地版本滞后，拉取云端",
  202: "本地云端版本异常偏大",
  203: "本地有未上传的编辑",
  301: "版本一致，无需更新",
  302: "云端版本更高",
  401: "该行正在被其他窗口编辑",
  402: "编辑权被抢占，请重试",
  501: "同步成功",
  601: "重发请求已受理",
  999: "表头不匹配"
};

/**
 * 同步主入口
 * @param chuli  ""（默认）| "align"（以云端为准）| "force"（以本地为准）
 * @param isAuto 是否由自动同步定时器触发
 */
async function doSync(chuli, isAuto) {
  if (!checkLoginStatus()) { stopBrokenRetry(); return; }

  if (syncInFlight) {
    appendWsLog("⏳ 上一次同步尚未返回，本次跳过（防并发）");
    return;
  }
  if (!acquireCrossTabLock()) {
    appendWsLog("⏳ 另一个窗口正在同步，本次跳过（跨页互斥）");
    return;
  }

  syncInFlight = true;
  const btn = document.getElementById("btnSync");
  if (btn) btn.disabled = true;

  const logSend = document.getElementById("logSend");
  const logResp = document.getElementById("logResp");

  setStatus("同步中…", "info");
  logSend.innerText = "打包中…";
  logResp.innerText = "等待接口…";

  const currentYonghuID = getYonghuID();
  const bendibanben = getLocalVer();
  const bediyunbanben = getBediyunbanben();
  const LSID = getLSID();
  const bendixinxi = JSON.stringify(getLocalData());

  const argv = { bendibanben, bediyunbanben, bendixinxi, LSID, yonghuID: currentYonghuID };
  if (chuli) argv.chuli = chuli;
  const body = { webhookUrl: WEBHOOK_URL, message: { Context: { argv: argv } } };

  logSend.innerText = JSON.stringify(body, null, 2);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const txt = await res.text();
    let decodedTxt = txt;
    try { decodedTxt = decodeURIComponent(txt); } catch (e) { }
    logResp.innerText = "状态: " + res.status + "\n\n" + decodedTxt;

    let json;
    try { json = JSON.parse(decodedTxt); } catch (e) {
      if (hasBrokenChar(decodedTxt)) { sendResendRequest(); return; }
      setStatus("返回非 JSON，请检查云函数", "error");
      return;
    }

    // 云函数把脚本执行异常放在 error 字段里，必须显式识别，否则会静默失败
    const r = (json.data && json.data.result) ? json.data.result : (json.error ? null : json);
    if (!r) {
      setStatus("云端脚本执行出错：" + (json.error || "未知错误"), "error");
      appendWsLog("❌ 云端脚本异常：" + (json.error || ""));
      return;
    }

    if (hasBrokenChar(JSON.stringify(r)) || hasBrokenChar(r.yunxinxi || "")) {
      sendResendRequest();
      return;
    }

    handleResult(r, isAuto);

  } catch (e) {
    if (hasBrokenChar(e.toString())) { sendResendRequest(); return; }
    setStatus("同步异常：" + e.message, "error");
    logResp.innerText = "异常：" + e.toString();
    stopBrokenRetry();
  } finally {
    syncInFlight = false;
    if (btn) btn.disabled = false;
    releaseCrossTabLock();
    refreshVersion();
  }
}

/* 按状态码分派处置 */
function handleResult(r, isAuto) {
  const code = Number(r.TZbianhao);
  const msg = r.tongzhi || "无消息";
  const yunbanben = toInt(r.yunbanben);
  const yunxinxi = r.yunxinxi || "";

  appendWsLog("📥 [" + code + "] " + msg);

  switch (code) {

    /* ---- 成功写入：本地即云端，只校准版本号，不覆盖内容 ---- */
    case 501:
      setVersions(yunbanben);
      notifyParentToRefresh();
      setStatus("【501】" + msg);
      sendVersionToWs(yunbanben);
      break;

    /* ---- 静默拉取 ---- */
    case 201:
      if (applyCloudData(yunbanben, yunxinxi)) {
        notifyParentToRefresh();
        setStatus("【201】" + msg + "（已自动拉取）");
      } else {
        setStatus("【201】云端数据无法解析，已保留本地数据", "warn");
      }
      break;

    /* ---- 人工处置：以云端为准（对齐）---- */
    case 202:
    case 203:
    case 302:
      if (r.chuliKeXuan && r.chuliKeXuan.length) {
        showConflict(code, msg, r, isAuto);
      } else if (code === 302 && !isAuto) {
        // 没有可选项时保守处理：云端更高就拉取
        if (applyCloudData(yunbanben, yunxinxi)) { notifyParentToRefresh(); setStatus("【302】已拉取云端数据"); }
      } else {
        showConflict(code, msg, r, isAuto);
      }
      break;

    /* ---- 编辑冲突：可自愈，不打扰用户 ---- */
    case 401:
    case 402:
      setStatus("【" + code + "】" + msg, "warn");
      appendWsLog("ℹ️ 本次未写入，稍后自动重试即可");
      break;

    /* ---- 对齐完成（人工选"以云端为准"后）---- */
    case 301:
      setVersions(yunbanben);
      if (yunxinxi) {
        applyCloudData(yunbanben, yunxinxi);
        notifyParentToRefresh();
      }
      setStatus("【301】" + msg);
      break;

    /* ---- 重发（乱码）---- */
    case 601:
      if (yunxinxi && applyCloudData(yunbanben, yunxinxi)) notifyParentToRefresh();
      setStatus("【601】" + msg);
      break;

    /* ---- 编码异常：重试 ---- */
    case 107: {
      retryCount++;
      setStatus("编码异常！第 " + retryCount + "/" + maxRetry + " 次重试...", "warn");
      if (retryCount >= maxRetry) {
        stopBrokenRetry();
        const brokenKeys = findBrokenData();
        setStatus("编码异常：请修复【" + brokenKeys.join("、") + "】中的乱码 �", "error");
        alert("❌ 连续 " + maxRetry + " 次发送失败！\n本地数据存在乱码 �\n乱码位置：" + brokenKeys.join("、") + "\n请删除乱码符号后重试！");
        return;
      }
      retryTimer = setTimeout(function () { doSync("", false); }, 1000);
      return;
    }

    default:
      setStatus("【" + code + "】" + msg, "error");
      break;
  }

  try {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "syncResult", code: code, message: msg }, "*");
    }
  } catch (e) { }
}

/* ======================= 人工处置对话框 ======================= */

let conflictData = null;

function showConflict(code, msg, r, isAuto) {
  // 先暂停自动同步，否则每隔几十秒就会再弹一次，闹到没法用
  if (autoTimer) {
    pauseAutoForConflict();
  }
  conflictPaused = true;
  conflictData = { code: code, r: r };

  document.getElementById("cfTitle").textContent =
    code === 202 ? "版本账目对不上（202），请选择处理方式"
      : code === 203 ? "本地有未上传的编辑（203），请选择处理方式"
        : "云端版本更高（302），请选择处理方式";

  const lines = [];
  lines.push(msg);
  lines.push("");
  lines.push("本地版本号：" + getLocalVer());
  lines.push("本地记的云端版本号：" + getBediyunbanben());
  lines.push("表格里实际的云端版本号：" + toInt(r.yunbanben));
  if (code === 202) {
    lines.push("");
    lines.push("说明：本地记的云端版本号比表格实际值还大，属于版本账目错乱，数据本身没有损坏。");
    lines.push("多半是同时在两个窗口/设备同步造成的。");
  }
  if (code === 203) {
    lines.push("");
    lines.push("说明：云端比你本地记的多走了 " + toInt(r.loseSteps) + " 步。");
    lines.push("选「以本地为准」你刚编辑的内容会保留；选「以云端为准」则会被覆盖。");
  }
  document.getElementById("cfMsg").textContent = lines.join("\n");

  const box = document.getElementById("cfBtns");
  box.innerHTML = "";

  let options = r.chuliKeXuan;
  if (!options || !options.length) {
    options = [
      { action: "align", label: "以云端为准（拉取云端数据，本地版本对齐）" },
      { action: "force", label: "以本地为准（强制上传，覆盖云端）" },
      { action: "", label: "稍后手动处理（保持暂停自动同步）" }
    ];
  }

  options.forEach(function (opt, i) {
    const b = document.createElement("button");
    b.className = i === 0 ? "cf-a" : i === 1 ? "cf-b" : "cf-c";
    b.textContent = opt.label;
    b.onclick = function () { resolveConflict(opt.action); };
    box.appendChild(b);
  });

  document.getElementById("conflictModal").style.display = "flex";
}

function resolveConflict(action) {
  document.getElementById("conflictModal").style.display = "none";

  if (!action) {
    setStatus("已保留冲突状态，自动同步保持暂停。处理好后再点「立即同步」。", "warn");
    appendWsLog("⏸️ 用户选择稍后处理，自动同步保持暂停");
    return;
  }

  if (action === "align") {
    setStatus("正在以云端为准对齐…", "info");
  } else {
    setStatus("正在以本地为准强制上传…", "info");
  }
  conflictPaused = false;
  doSync(action, false);
}

function pauseAutoForConflict() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  updateSyncStatusLabel();
  appendWsLog("⏸️ 检测到需要人工处置的冲突，自动同步已暂时停止");
}

/* ======================= 乱码重发 ======================= */

async function sendResendRequest() {
  if (!checkLoginStatus()) return;
  stopBrokenRetry();
  setStatus("检测到云端乱码，自动请求重发...", "warn");

  const body = {
    webhookUrl: WEBHOOK_URL,
    message: {
      Context: {
        argv: {
          bendibanben: getLocalVer(),
          bediyunbanben: getBediyunbanben(),
          bendixinxi: "收到乱码请求重发",
          LSID: getLSID(),
          yonghuID: getYonghuID()
        }
      }
    }
  };
  document.getElementById("logSend").innerText = "【自动重发】" + JSON.stringify(body, null, 2);

  try {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const txt = await res.text();
    document.getElementById("logResp").innerText = "【重发响应】状态: " + res.status + "\n\n" + txt;

    let json;
    try { json = JSON.parse(txt); } catch (e) { setStatus("重发返回非JSON", "error"); return; }
    const r = (json.data && json.data.result) ? json.data.result : json;
    if (!r || !r.yunxinxi) {
      setStatus("重发未取到云端数据，已保留本地数据", "warn");
      return;
    }
    if (applyCloudData(toInt(r.yunbanben), r.yunxinxi)) notifyParentToRefresh();
    setStatus("✅ 重发成功：" + (r.tongzhi || ""));
  } catch (e) {
    setStatus("重发异常：" + e.message, "error");
  }
}

/* ======================= WebSocket ======================= */

function uidHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function wsUrl() {
  const uid = getYonghuID();
  // 频道名用哈希，不把手机号暴露在公共频道
  const ch = "ksjsb-" + (uid ? uidHash(uid) : "anon") + "-v1";
  return WS_BASE + ch + "?api_key=" + WS_KEY;
}
function myTag() { const uid = getYonghuID(); return uid ? uidHash(uid) : ""; }

function initWebSocket() {
  if (!isUserLoggedIn()) {
    setWsStatus("未登录，WebSocket未连接", true);
    return;
  }
  if (ws) { try { ws.close(); } catch (e) { } ws = null; }
  clearBroadcastTimers();

  ws = new WebSocket(wsUrl());

  ws.onopen = function () {
    setWsStatus("WebSocket 已连接 ✅");
    appendWsLog("✅ 长连接建立成功");
    clearTimeout(wsReconnectTimer);
    startHeartbeat();
  };

  ws.onmessage = function (e) {
    if (!isUserLoggedIn()) return;
    let data;
    try { data = JSON.parse(e.data); } catch (err) { appendWsLog("📥 收到纯文本：" + e.data); return; }
    appendWsLog("📥 收到消息：" + JSON.stringify(data));

    if (data.type === "version" && data.yunbanben) {
      if (data.uid && data.uid !== myTag()) {
        appendWsLog("🔇 忽略其他用户的版本更新");
        return;
      }
      const remoteVersion = toInt(data.yunbanben);
      if (remoteVersion > getBediyunbanben()) {
        appendWsLog("🚨 远程版本更高（" + remoteVersion + "），触发同步");
        doSync("", true);
      }
    }
  };

  ws.onclose = function () {
    setWsStatus("WebSocket 已断开 ❌", true);
    stopHeartbeat();
    clearBroadcastTimers();
    if (isUserLoggedIn()) wsReconnectTimer = setTimeout(initWebSocket, reconnectDelay);
  };

  ws.onerror = function () { setWsStatus("WebSocket 连接失败 ❌", true); };
}

function sendWsMessage(data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { appendWsLog("❌ 发送失败：WebSocket未连接"); return; }
  ws.send(JSON.stringify(data));
}

function sendVersionToWs(yunbanben) {
  clearBroadcastTimers();
  const count = Number(document.getElementById("broadcastCount").value) || 3;
  const sec = Number(document.getElementById("broadcastSec").value) || 10;
  const send = function () {
    sendWsMessage({
      type: "version", yunbanben: yunbanben, lsid: getLSID(),
      uid: myTag(), time: new Date().toLocaleString()
    });
    appendWsLog("📢 版本广播：v" + yunbanben);
  };
  send();
  for (let i = 1; i < count; i++) broadcastTimers.push(setTimeout(send, i * sec * 1000));
}

function clearBroadcastTimers() {
  broadcastTimers.forEach(function (t) { clearTimeout(t); });
  broadcastTimers = [];
}

function startHeartbeat() {
  if (!isUserLoggedIn()) return;
  stopHeartbeat();
  const sec = Number(document.getElementById("heartbeatSec").value) || 60;
  heartbeatTimer = setInterval(function () {
    if (!isUserLoggedIn()) { stopHeartbeat(); return; }
    sendWsMessage({ type: "ping", action: "heartbeat", uid: myTag(), time: new Date().toLocaleString() });
  }, sec * 1000);
  appendWsLog("✅ 心跳已启动，间隔 " + sec + " 秒");
}
function stopHeartbeat() { if (heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer = null; }

function sendWsChat() {
  const input = document.getElementById("wsChat");
  const content = input.value.trim();
  if (!content) return;
  sendWsMessage({ type: "chat", content: content, lsid: getLSID(), uid: myTag(), time: new Date().toLocaleString() });
  input.value = "";
}

/* ======================= 用户 / 自动同步 ======================= */

function saveYonghuID() {
  const v = document.getElementById("yonghuID").value.trim();
  if (!v) { setStatus("请输入用户ID", "error"); return; }
  const changed = (getYonghuID() !== v);
  localStorage.setItem(STORAGE_KEYS.yonghuID, v);
  document.getElementById("v_yonghu").innerText = v;
  setStatus("用户ID已保存");
  appendWsLog("✅ 用户ID已保存：" + v);
  if (changed) { try { if (ws) ws.close(); } catch (e) { } ws = null; }
  initWebSocket();
  startAuto();
}

let lastVersionCheck = { local: 0, cloud: 0, time: Date.now() };

function startAuto() {
  if (!checkLoginStatus()) { stopAuto(); stopBrokenRetry(); return; }
  if (conflictPaused) {
    appendWsLog("⏸️ 存在未处理的冲突，自动同步未启动");
    setStatus("存在未处理的冲突，请先处理", "warn");
    return;
  }

  stopAuto();
  const noDiffSec = Number(document.getElementById("syncNoDiff").value) || 300;
  const diffSec = Number(document.getElementById("syncDiff").value) || 30;
  const diffLimit = Number(document.getElementById("diffLimit").value) || 10;
  const maxRunMs = (Number(document.getElementById("maxRunTime").value) || 4) * 3600 * 1000;

  const smartSync = function () {
    if (!isUserLoggedIn()) { stopAuto(); setStatus("自动同步已暂停（未登录）", "warn"); return; }
    if (conflictPaused) { pauseAutoForConflict(); return; }
    if (syncInFlight) { appendWsLog("⏳ 上一轮同步未结束，跳过本轮"); return; }

    const local = getLocalVer();
    const cloud = getBediyunbanben();

    if (local !== lastVersionCheck.local || cloud !== lastVersionCheck.cloud) {
      lastVersionCheck = { local: local, cloud: cloud, time: Date.now() };
      appendWsLog("📊 版本号变化: 本地=" + local + ", 云端=" + cloud);
    } else if (Date.now() - lastVersionCheck.time > maxRunMs) {
      appendWsLog("⏰ 长时间无版本变化，自动停止同步");
      stopAuto();
      setStatus("自动同步已自动停止（长时间无版本变化）", "warn");
      return;
    }
    doSync("", true);
  };

  const diff = Math.abs(getBediyunbanben() - getLocalVer());
  const interval = diff === 0 ? noDiffSec * 1000 : diffSec * 1000;
  smartSync();
  autoTimer = setInterval(smartSync, interval);
  appendWsLog("🔄 自动同步已启动，间隔 " + (diff === 0 ? noDiffSec : diffSec) + " 秒");
  setStatus("自动同步已启动");
  updateSyncStatusLabel();
}

function stopAuto() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = null;
  stopBrokenRetry();
  updateSyncStatusLabel();
}

function toggleAutoSync() {
  if (autoTimer) {
    stopAuto();
    stopHeartbeat();
    if (ws) { try { ws.close(); } catch (e) { } ws = null; }
    setWsStatus("WebSocket 已关闭", true);
    appendWsLog("🔴 已关闭自动同步、心跳与 WebSocket");
    setStatus("自动同步已停止");
  } else {
    if (!checkLoginStatus()) return;
    conflictPaused = false; // 手动开启视为用户已了解现状
    startAuto();
    initWebSocket();
    startHeartbeat();
    appendWsLog("🟢 已开启自动同步、心跳与 WebSocket");
  }
  updateSyncStatusLabel();
}

/* ======================= 与父页面通信 ======================= */

window.addEventListener('message', function (e) {
  // 父页面用它触发一次同步
  if (e.data === 'triggerSync') {
    appendWsLog("📢 收到父页面同步请求");
    doSync("", false);
    return;
  }
  if (e.data === 'loginStatusChanged') {
    appendWsLog("📢 收到登录状态变化通知");
    refreshVersion();
    if (isUserLoggedIn()) {
      conflictPaused = false;
      setStatus("就绪");
      initWebSocket();
      startHeartbeat();
      startAuto();
      try { if (window.parent !== window) window.parent.postMessage({ type: 'loginSyncReady' }, '*'); } catch (err) { }
    } else {
      setStatus("请先登录", "error");
      setWsStatus("未登录，WebSocket未连接", true);
      stopAuto();
      stopBrokenRetry();
      if (ws) { try { ws.close(); } catch (err) { } ws = null; }
      stopHeartbeat();
      clearBroadcastTimers();
    }
  }
});

/* ======================= 初始化 ======================= */

window.onload = function () {
  refreshVersion();
  document.getElementById("yonghuID").value = getYonghuID();
  if (isUserLoggedIn()) {
    setStatus("就绪");
    initWebSocket();
    startHeartbeat();
    startAuto();
  } else {
    setStatus("请先登录", "error");
    setWsStatus("未登录，WebSocket未连接", true);
    appendWsLog("🔒 未登录，同步功能已暂停");
  }
  updateSyncStatusLabel();
};
